name: CI

on:
  push:
    branches: [main, 'release-please--**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          # ZeroAlloc.Outbox.Tests targets net8.0 as well, to run the EF Core store against
          # EF Core 9; install that runtime explicitly rather than trusting the runner image.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run GitVersion
        id: gitversion
        run: |
          VERSION=$(dotnet gitversion /showvariable SemVer)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.gitversion.outputs.version }}

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack (verify)
        env:
          VERSION: ${{ steps.gitversion.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          # The same discovery the release workflow uses, so CI pack-tests exactly the set
          # a release ships. The hardcoded list here covered 4 of the 10 packages, so a pack
          # failure in any other package surfaced only at release time.
          # See ZeroAlloc-Net/.github#36.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (IsPackable=false)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" --no-build -c Release -p:Version="$VERSION" -o ./artifacts
          done
          ls -la ./artifacts
          if ! ls ./artifacts/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes samples/ZeroAlloc.Outbox.AotSmoke with PublishAot=true and IL warnings
    # as errors. It registers the outbox the documented AOT way, AddSerializerDispatcher()
    # plus AddOutbox(), then writes a message through the generator-emitted writer and waits
    # for the worker to dispatch it through the generator-emitted type dispatcher.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Outbox.AotSmoke/ZeroAlloc.Outbox.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Outbox.AotSmoke/ZeroAlloc.Outbox.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        run: ./aot-out/ZeroAlloc.Outbox.AotSmoke

  # No inputs: the workflow discovers every packable project under src/ and
  # checks each against its own published baseline. Naming one package here is
  # what left the adapters unguarded and let a binary break ship in
  # ZeroAlloc.Outbox.Orm 2.7.0. See ZeroAlloc-Net/.github#30.
  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
