<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outbox Dashboard</title>
  <base href="{{BASE_PATH}}">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="outbox.css">
</head>
<body>
  <header>
    <h1>Outbox</h1>
    <nav id="summary">
      <span>Pending: <b id="count-pending">0</b></span>
      <span>Retry: <b id="count-retry">0</b></span>
      <span>Dead: <b id="count-dead">0</b></span>
      <span id="sse-indicator" class="connecting">&#9679; connecting</span>
    </nav>
  </header>
  <section id="chart-section">
    <div id="chart-inner">
      <svg id="throughput-chart" viewBox="0 0 600 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>
  <section id="tabs">
    <div class="tab-bar">
      <button type="button" data-tab="pending" class="active">Pending</button>
      <button type="button" data-tab="retry">Retry Queue</button>
      <button type="button" data-tab="dead">Dead-lettered</button>
      <button type="button" data-tab="dispatched">Dispatched</button>
    </div>
    <div id="tab-pending" class="tab-panel active"><div class="table-wrap"><table></table></div></div>
    <div id="tab-retry" class="tab-panel"><div class="table-wrap"><table></table></div></div>
    <div id="tab-dead" class="tab-panel"><div class="table-wrap"><table></table></div></div>
    <div id="tab-dispatched" class="tab-panel"><div class="table-wrap"><table></table></div></div>
  </section>
  <script src="outbox.js"></script>
</body>
</html>
